<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Escáner — Vaylen POS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    #btnCancelar {
      background: #ef4444;
      border: none;
      color: #fff;
      padding: 7px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    #btnCancelar:active { opacity: .8; }

    /* ── Estado / mensajes ── */
    #status {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      color: #94a3b8;
    }
    #status.ok    { color: #4ade80; }
    #status.error { color: #f87171; }
    #status.warn  { color: #fbbf24; }

    /* ── Visor de cámara ── */
    #visor-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    /* html5-qrcode inyecta un div con id="reader" */
    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    /* Ocultar controles extra que inyecta la lib */
    #reader__scan_region { border: none !important; }
    #reader__dashboard    { display: none !important; }

    /* Marco guía sobre el video */
    #guide-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 320px);
      height: 120px;
      border: 2.5px solid #facc15;
      border-radius: 10px;
      pointer-events: none;
      box-shadow: 0 0 0 3000px rgba(0,0,0,.45);
      z-index: 10;
    }
    /* Línea animada de escaneo */
    #scan-line {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #facc15 40%, #facc15 60%, transparent);
      border-radius: 2px;
      animation: scanline 1.8s ease-in-out infinite;
    }
    @keyframes scanline {
      0%   { top: 8px;  opacity: 1; }
      50%  { top: 102px; opacity: 1; }
      100% { top: 8px;  opacity: 1; }
    }

    /* ── Pantalla de error (permiso denegado) ── */
    #error-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 24px;
      text-align: center;
      flex: 1;
    }
    #error-screen.visible { display: flex; }
    #error-screen .icon   { font-size: 56px; line-height: 1; }
    #error-screen h2      { font-size: 18px; font-weight: 700; }
    #error-screen p       { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    #btnReintentar {
      background: #2563eb;
      border: none;
      color: #fff;
      padding: 11px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      touch-action: manipulation;
    }
    #btnReintentar:active { opacity: .8; }

    /* Flash verde al detectar */
    #flash {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(74, 222, 128, .35);
      z-index: 999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>📷 Escáner de código</h1>
    <button id="btnCancelar" onclick="cancelar()">✕ Cancelar</button>
  </header>

  <!-- Status bar -->
  <div id="status">Iniciando cámara…</div>

  <!-- Visor principal -->
  <div id="visor-wrap">
    <div id="reader"></div>
    <div id="guide-frame">
      <div id="scan-line"></div>
    </div>
  </div>

  <!-- Pantalla de error -->
  <div id="error-screen">
    <div class="icon">🚫</div>
    <h2>Cámara no disponible</h2>
    <p id="error-msg">El permiso de cámara fue denegado. Toca el ícono de cámara/candado en la barra del navegador y permite el acceso. Luego toca Reintentar.</p>
    <button id="btnReintentar" onclick="reintentar()">🔄 Reintentar</button>
  </div>

  <!-- Flash feedback -->
  <div id="flash"></div>

  <!-- html5-qrcode via CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    'use strict';

    var scanner    = null;
    var yaEnvio    = false;  // evitar dobles disparos
    var scannerActivo = false;

    /* ────── Utilidades ────── */

    function setStatus(msg, cls) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className   = cls || '';
    }

    function mostrarError(msg) {
      document.getElementById('visor-wrap').style.display = 'none';
      var es = document.getElementById('error-screen');
      es.classList.add('visible');
      if (msg) document.getElementById('error-msg').textContent = msg;
      setStatus('Permiso denegado', 'error');
    }

    function flash() {
      var el = document.getElementById('flash');
      el.style.display = 'block';
      setTimeout(function() { el.style.display = 'none'; }, 300);
    }

    /* ────── Enviar resultado y cerrar ────── */

    function enviarCodigo(codigo) {
      if (yaEnvio) return;
      yaEnvio = true;
      flash();
      setStatus('✅ Detectado: ' + codigo, 'ok');

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(
            { tipo: 'codigo_escaneado', valor: String(codigo).trim() },
            '*'
          );
        } else {
          // Fallback: localStorage por si el opener ya cerró
          localStorage.setItem('vaylen_scan_codigo', JSON.stringify({
            valor: String(codigo).trim(),
            ts:    Date.now()
          }));
        }
      } catch(e) {
        console.warn('postMessage error:', e);
      }

      // Dar tiempo a que el flash sea visible, luego cerrar
      setTimeout(function() {
        detenerScanner(function() { window.close(); });
      }, 350);
    }

    function cancelar() {
      detenerScanner(function() { window.close(); });
    }

    /* ────── Controlar scanner ────── */

    function detenerScanner(cb) {
      if (scanner && scannerActivo) {
        scannerActivo = false;
        scanner.stop().then(function() {
          if (cb) cb();
        }).catch(function() {
          if (cb) cb();
        });
      } else {
        if (cb) cb();
      }
    }

    function onScanExito(decodedText) {
      if (yaEnvio) return;
      enviarCodigo(decodedText);
    }

    // La librería llama a esto cada frame que NO detecta nada; lo ignoramos
    function onScanFallo() {}

    /* ────── Iniciar escáner ────── */

    function iniciarScanner() {
      yaEnvio   = false;
      document.getElementById('visor-wrap').style.display = 'flex';
      document.getElementById('error-screen').classList.remove('visible');
      setStatus('Apunta la cámara al código de barras', '');

      // Destruir instancia previa si existe
      if (scanner) {
        try { scanner.clear(); } catch(e) {}
      }

      scanner = new Html5Qrcode('reader', {
        verbose: false
      });

      var config = {
        fps:  12,
        qrbox: function(w, h) {
          var lado = Math.min(w, h) * 0.72;
          return { width: Math.round(lado), height: Math.round(lado * 0.45) };
        },
        rememberLastUsedCamera: true,
        aspectRatio: 1.0,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };

      scanner.start(
        { facingMode: 'environment' },
        config,
        onScanExito,
        onScanFallo
      )
      .then(function() {
        scannerActivo = true;
        setStatus('📷 Cámara activa — centrando el código en el marco amarillo', 'ok');
      })
      .catch(function(err) {
        scannerActivo = false;
        var msg = 'No se pudo activar la cámara.';
        if (err) {
          var s = String(err.message || err);
          if (/not allowed|denied|permission/i.test(s)) {
            msg = 'Permiso de cámara denegado. Toca el ícono de cámara/candado en la barra del navegador, elige "Permitir" y toca Reintentar.';
          } else if (/not found|no device/i.test(s)) {
            msg = 'No se encontró cámara en este dispositivo.';
          } else if (/https|secure/i.test(s)) {
            msg = 'La cámara requiere conexión segura (HTTPS). Asegúrate de abrir esta página desde GitHub Pages con https://.';
          }
        }
        mostrarError(msg);
      });
    }

    function reintentar() { iniciarScanner(); }

    /* ────── Arrancar al cargar ────── */

    window.addEventListener('load', iniciarScanner);

    // Si el usuario cierra con X del navegador sin enviar, no pasa nada
    window.addEventListener('beforeunload', function() {
      detenerScanner(null);
    });
  </script>
</body>
</html>
