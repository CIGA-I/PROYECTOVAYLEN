<!DOCTYPE html>
<html lang="es">
<head>

  <title>VAYLEN STORE</title>

  <meta name="application-name" content="VAYLEN STORE">
  <meta name="apple-mobile-web-app-title" content="VAYLEN STORE">
  <meta name="theme-color" content="#19d9df">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(145deg, #19d9df, #0fbdc8);
      font-family: Arial, sans-serif;
      color: #18324b;
    }

    main {
      width: min(100%, 360px);
      padding: 28px 22px;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0, 70, 80, .25);
    }

    img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0 0 22px;
      color: #64748b;
      font-size: 14px;
    }

    a {
      display: block;
      padding: 14px 18px;
      border-radius: 12px;
      background: #18324b;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <img src="./vaylen-icon-512.png"
         alt="Logo VAYLEN STORE">
